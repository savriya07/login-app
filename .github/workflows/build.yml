name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
      - name: Create android folder only first time
        run: |
          if [! -d "android" ]; then
            flutter create. --project-name myapp --platforms=android --org com.example
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Login-APK
          path: build/app/outputs/flutter-apk/app-release.apk
